services:
  - type: web
    name: xfilms
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_BRAND
        value: xFilms
      - key: BOT_SLUG
        value: xfilms
      - key: DATABASE_DIR
        value: /opt/render/project/src/artifacts/api-server/data
    disk:
      name: xfilms-data
      mountPath: /opt/render/project/src/artifacts/api-server/data
      sizeGB: 1